<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartShip — Login</title>
  <link rel="stylesheet" type="text/css" href="/css/style.css"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="logo-icon">🚚</div>
      Smart<span class="text-amber">Ship</span>
    </div>
    <p style="color:#64748b;font-size:0.82rem;margin-bottom:1.5rem">Transparent Transport Bidding System</p>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Login</button>
      <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</button>
    </div>

    <!-- LOGIN -->
    <div id="login-form">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input id="login-username" class="form-control" type="text" placeholder="Enter your username"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input id="login-password" class="form-control" type="password" placeholder="Enter your password"/>
      </div>
      <div id="login-error" class="alert alert-error hidden"></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-bottom:1.4rem" onclick="doLogin()">
        🔐 Login
      </button>
    </div>

    <!-- REGISTER -->
    <div id="register-form" class="hidden">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Username *</label>
          <input id="reg-username" class="form-control" type="text" placeholder="e.g. john_doe"/>
        </div>
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input id="reg-fullname" class="form-control" type="text" placeholder="John Doe"/>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email *</label>
        <input id="reg-email" class="form-control" type="email" placeholder="john@example.com"/>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Password *</label>
          <input id="reg-password" class="form-control" type="password" placeholder="Min 6 characters"/>
        </div>
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input id="reg-phone" class="form-control" type="text" placeholder="9XXXXXXXXX"/>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">I am a...</label>
        <select id="reg-role" class="form-control">
          <option value="CUSTOMER">📦 Customer — I need items delivered</option>
          <option value="SHIPPER">🚚 Shipper — I deliver goods</option>
        </select>
      </div>
      <div id="reg-error"   class="alert alert-error   hidden"></div>
      <div id="reg-success" class="alert alert-success hidden"></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="doRegister()">
        ✨ Create Account
      </button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  if (Session.isLoggedIn()) redirectToDashboard();

  function redirectToDashboard() {
    const role = Session.role();
    if (role === 'CUSTOMER') location.href = '/customer-dashboard.html';
    else if (role === 'SHIPPER') location.href = '/shipper-dashboard.html';
    else if (role === 'ADMIN') location.href = '/admin-dashboard.html';
    else location.href = '/index.html';
  }

  function switchTab(tab) {
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    document.getElementById('login-form').classList.toggle('hidden', tab !== 'login');
    document.getElementById('register-form').classList.toggle('hidden', tab !== 'register');
    ['login-error','reg-error','reg-success'].forEach(id => document.getElementById(id).classList.add('hidden'));
  }

  async function doLogin() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    errEl.classList.add('hidden');
    if (!username || !password) { errEl.textContent='Please enter username and password.'; errEl.classList.remove('hidden'); return; }
    try {
      const data = await Api.login({ username, password });
      Session.save(data);
      showToast('Welcome, ' + data.fullName + '!', 'success');
      setTimeout(redirectToDashboard, 500);
    } catch(e) { errEl.textContent = e.message || 'Invalid credentials.'; errEl.classList.remove('hidden'); }
  }

  async function doRegister() {
    const body = {
      username: document.getElementById('reg-username').value.trim(),
      fullName: document.getElementById('reg-fullname').value.trim(),
      email:    document.getElementById('reg-email').value.trim(),
      password: document.getElementById('reg-password').value,
      phone:    document.getElementById('reg-phone').value.trim(),
      role:     document.getElementById('reg-role').value,
    };
    const errEl = document.getElementById('reg-error'), okEl = document.getElementById('reg-success');
    errEl.classList.add('hidden'); okEl.classList.add('hidden');
    if (!body.username||!body.email||!body.password||!body.fullName) { errEl.textContent='Fill all required fields.'; errEl.classList.remove('hidden'); return; }
    if (body.password.length < 6) { errEl.textContent='Password must be at least 6 characters.'; errEl.classList.remove('hidden'); return; }
    try {
      const data = await Api.register(body);
      okEl.textContent = '✅ ' + data.message; okEl.classList.remove('hidden');
      setTimeout(() => switchTab('login'), 1800);
    } catch(e) { errEl.textContent = e.message || 'Registration failed.'; errEl.classList.remove('hidden'); }
  }

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (!document.getElementById('login-form').classList.contains('hidden')) doLogin();
    else doRegister();
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartShip — Live Bidding</title>
  <link rel="stylesheet" type="text/css" href="/css/style.css"/>
</head>
<body>
<nav class="navbar">
  <a class="navbar-brand" href="/index.html"><div class="logo-icon">🚚</div>Smart<span>Ship</span></a>
  <div class="navbar-right">
    <div class="nav-user" id="nav-user"></div>
    <div class="live-indicator"><div class="pulse-dot"></div> Live (2s)</div>
    <button class="btn btn-ghost btn-sm" onclick="goBack()">← Back</button>
    <button class="btn btn-ghost btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="page-wrapper">
  <div class="page-header">
    <div><h1 id="page-title">Live Bidding Room</h1><div class="subtitle" id="page-sub">Loading...</div></div>
  </div>

  <div id="req-info" class="request-info-grid"></div>

  <div class="lowest-bid-bar" id="lowest-bar" style="display:none">
    <div><div class="lbb-label">🏆 Current Lowest Bid</div><div id="lb-by" style="font-size:0.78rem;color:rgba(16,185,129,0.7);margin-top:2px"></div></div>
    <div class="lbb-price" id="lb-price">—</div>
  </div>

  <div id="outbid-alert" class="alert alert-error hidden">⚠️ <strong>You are outbid!</strong> Place a lower bid to reclaim the lead.</div>

  <div id="bid-form-section" class="bid-form-card hidden">
    <h3 style="margin-bottom:1.1rem">💰 Place Your Bid</h3>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Your Price (₹) *</label><input id="bid-price" class="form-control" type="number" step="1" min="1" placeholder="Must be lower than current lowest"/></div>
      <div class="form-group"><label class="form-label">Estimated Delivery (hours) *</label><input id="bid-hours" class="form-control" type="number" min="1" placeholder="e.g. 24"/></div>
    </div>
    <div class="form-group"><label class="form-label">Notes (optional)</label><input id="bid-notes" class="form-control" type="text" placeholder="e.g. Includes packaging, GPS tracked"/></div>
    <div id="bid-err" class="alert alert-error hidden"></div>
    <div id="bid-ok"  class="alert alert-success hidden"></div>
    <button class="btn btn-primary" id="bid-btn" onclick="submitBid()">Submit Bid →</button>
  </div>

  <div class="card">
    <div class="card-header">
      <h3>📊 All Bids — Full Transparency</h3>
      <span id="bid-count" class="badge badge-amber">0 bids</span>
    </div>
    <div id="bid-table"><div class="loader"><div class="spinner"></div> Loading bids...</div></div>
  </div>
</div>

<!-- Award Modal -->
<div class="modal-overlay" id="awardModal">
  <div class="modal">
    <div class="modal-header"><h3>🏆 Award This Bid?</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <p style="color:#94a3b8;font-size:0.9rem;margin-bottom:1.4rem">
      Awarding <strong id="aw-shipper" class="text-amber"></strong> at <strong id="aw-price" class="text-green"></strong>.
      This will close bidding and create a confirmed order.
    </p>
    <div style="display:flex;gap:1rem;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-success" onclick="confirmAward()">✅ Confirm Award</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  if (!Session.isLoggedIn()) location.href = '/index.html';
  const params = new URLSearchParams(location.search);
const requestId = params.get('requestId');
const user = Session.get();

// Get role from session directly — don't rely on URL param
const sessionRole = (Session.role() || '').toUpperCase();
const isCustomer = sessionRole === 'CUSTOMER';
const isShipper  = sessionRole === 'SHIPPER';
const isAdmin    = sessionRole === 'ADMIN';

  if (!requestId) goBack();

  const roleLabel = isCustomer ? 'Customer' : isShipper ? 'Shipper' : 'Admin';
const roleIcon  = isCustomer ? '📦' : isShipper ? '🚛' : '🔑';
document.getElementById('nav-user').innerHTML =
    `${roleIcon} <strong>${user.fullName}</strong> · ${roleLabel}`;
  let timer = null, selectedBidId = null, reqData = null, lastCount = 0;

  async function loadRequest() {
    try {
      reqData = await Api.getRequestById(requestId);
      document.getElementById('page-title').textContent = `${reqData.pickupAddress}  →  ${reqData.dropAddress}`;
      document.getElementById('page-sub').textContent = `Request #${requestId}  ·  Status: ${reqData.status}  ·  By ${reqData.customerName}`;
      document.getElementById('req-info').innerHTML = `
        <div class="info-chip"><div class="chip-label">Item</div><div class="chip-value">📦 ${reqData.itemDescription}</div></div>
        <div class="info-chip"><div class="chip-label">Quantity</div><div class="chip-value">🔢 ${reqData.quantity} units</div></div>
        ${reqData.weightKg?`<div class="info-chip"><div class="chip-label">Weight</div><div class="chip-value">⚖️ ${reqData.weightKg} kg</div></div>`:''}
        ${reqData.budgetLimit?`<div class="info-chip"><div class="chip-label">Budget</div><div class="chip-value">💰 ${fmt.price(reqData.budgetLimit)}</div></div>`:''}
        <div class="info-chip"><div class="chip-label">Status</div><div class="chip-value"><span class="badge ${sb(reqData.status)}">${reqData.status}</span></div></div>`;
      // Show constraints to shipper
if (isShipper) {
    const pref = reqData.bidPreference || 'PRICE';
    const prefLabels = {
        PRICE:    '💰 Compete on LOWEST PRICE (faster delivery as tiebreak)',
        TIME:     '⚡ Compete on FASTEST DELIVERY (lower price as tiebreak)',
        BALANCED: '⚖️ Compete on BEST PRICE + SPEED combo',
    };

    // Update placeholders
    if (reqData.maxDeliveryHours) {
        document.getElementById('bid-hours').placeholder = 'Max: ' + reqData.maxDeliveryHours + ' hrs';
        document.getElementById('bid-hours').max = reqData.maxDeliveryHours;
    }
    if (reqData.budgetLimit) {
        document.getElementById('bid-price').placeholder = 'Max: ₹' + reqData.budgetLimit;
        document.getElementById('bid-price').max = reqData.budgetLimit;
    }
}
      // Show bid form for shippers on active requests
if (isShipper) {
    if (reqData.status === 'OPEN' || reqData.status === 'BIDDING') {
        document.getElementById('bid-form-section').classList.remove('hidden');

        // Show preference hint inside bid form
        const pref = reqData.bidPreference || 'PRICE';
        const prefLabels = {
            PRICE:    '💰 Compete on <strong>LOWEST PRICE</strong> — faster delivery as tiebreak',
            TIME:     '⚡ Compete on <strong>FASTEST DELIVERY</strong> — lower price as tiebreak',
            BALANCED: '⚖️ Compete on <strong>BEST PRICE + SPEED</strong> combo (60% price, 40% speed)',
        };


        // Set max constraints on inputs
        if (reqData.maxDeliveryHours) {
            document.getElementById('bid-hours').placeholder = 'Must be ≤ ' + reqData.maxDeliveryHours + ' hrs';
            document.getElementById('bid-hours').max = reqData.maxDeliveryHours;
        }
        if (reqData.budgetLimit) {
            document.getElementById('bid-price').placeholder = 'Must be ≤ ₹' + reqData.budgetLimit;
        }

    } else if (reqData.status === 'AWARDED') {
        // Show awarded message instead of form
        const formSection = document.getElementById('bid-form-section');
        formSection.classList.remove('hidden');
        formSection.innerHTML = `
            <div class="alert alert-info">
                ✅ This request has been awarded. Bidding is closed.
            </div>`;
    }
}
        // Show max delivery hours warning to shipper
       if (isShipper && reqData.maxDeliveryHours) {
    document.getElementById('bid-hours').placeholder =
        'Max allowed: ' + reqData.maxDeliveryHours + ' hrs';
    document.getElementById('bid-hours').max = reqData.maxDeliveryHours;
}
    } catch(e) { showToast('Failed to load request','error'); }
  }

  async function loadBids() {
    try {
      const data = await Api.getBidsForRequest(requestId);
      // Update lowest bar
      if (data.currentLowestPrice != null) {
        const leader = data.bids.find(b=>b.status==='ACTIVE');
        document.getElementById('lowest-bar').style.display='flex';
        document.getElementById('lb-price').textContent = fmt.price(data.currentLowestPrice);
        document.getElementById('lb-by').textContent = leader ? `by ${leader.shipperName}` : '';
        if (isShipper) document.getElementById('bid-price').placeholder = `Must be below ${fmt.price(data.currentLowestPrice)}`;
      } else {
        document.getElementById('lowest-bar').style.display='none';
      }
      document.getElementById('bid-count').textContent = `${data.totalBids} bid${data.totalBids!==1?'s':''}`;

      // Show preference banner
if (data.preference) {
  const banner = document.getElementById('pref-banner');
  const icons  = { PRICE:'💰', TIME:'⚡', BALANCED:'⚖️' };
  const titles = {
    PRICE:    'Price Preference — Lowest price leads',
    TIME:     'Speed Preference — Fastest delivery leads',
    BALANCED: 'Balanced Preference — Best price+speed combo leads',
  };
  const descs  = {
    PRICE:    'To lead: offer a lower price. Same price accepted only if faster.',
    TIME:     'To lead: offer faster delivery. Same time accepted only if cheaper.',
    BALANCED: 'To lead: improve the combined score (60% price + 40% speed).',
  };
  document.getElementById('pref-icon').textContent  = icons[data.preference]  + ' ';
  document.getElementById('pref-title').textContent = titles[data.preference];
  document.getElementById('pref-desc').textContent  = descs[data.preference];
  banner.style.display = 'flex';
}

      // Outbid check
      if (isShipper) {
        const mine = data.bids.filter(b=>b.shipperId==user.id);
        const active = mine.find(b=>b.status==='ACTIVE');
        const outbid = mine.some(b=>b.status==='OUTBID');
        document.getElementById('outbid-alert').classList.toggle('hidden', !(outbid && !active && mine.length>0));
      }

      renderTable(data.bids);
      if (lastCount>0 && data.totalBids>lastCount) showToast('⚡ New bid placed!','info');
      lastCount = data.totalBids;
    } catch(e) {}
  }

  function renderTable(bids) {
    const el = document.getElementById('bid-table');
    const awarded = reqData && reqData.status==='AWARDED';
    if (!bids.length) {
      el.innerHTML=`<div class="empty-state" style="padding:2.5rem"><div class="empty-icon">🎯</div><h3>No bids yet</h3><p>${isShipper?'Be the first to place a bid!':'Waiting for shippers to bid...'}</p></div>`; return;
    }
    el.innerHTML=`<div class="table-wrapper"><table>
      <thead><tr><th>Rank</th><th>Shipper</th><th>Price</th><th>Delivery</th><th>Notes</th><th>Status</th><th>Time</th>${isCustomer&&!awarded?'<th>Award</th>':''}</tr></thead>
      <tbody>${bids.map((b,i)=>{
        const leading = b.lowest && b.status==='ACTIVE';
        const isMe = isShipper && b.shipperId==user.id;
        return `<tr class="${leading?'lowest-bid-row row-in':''}">
          <td style="text-align:center">${leading?'👑':`<span style="color:#64748b">${i+1}</span>`}</td>
          <td><strong>${b.shipperName}</strong>${isMe?' <span class="badge badge-blue" style="font-size:0.63rem;padding:2px 6px">You</span>':''}</td>
          <td class="price-display" style="${leading?'color:#10b981':''}">${fmt.price(b.price)}</td>
          <td>${fmt.hours(b.estimatedDeliveryHours)}</td>
          <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#64748b">${b.notes||'—'}</td>
          <td>${bidBadge(b.status,leading)}</td>
          <td style="font-size:0.72rem;color:#64748b">${ago(b.createdAt)}</td>
          ${isCustomer&&!awarded?`<td>${b.status==='ACTIVE'?`<button class="btn btn-success btn-sm" onclick="openAward(${b.id},'${b.shipperName}',${b.price})">Award 🏆</button>`:'—'}</td>`:''}
        </tr>`;
      }).join('')}</tbody></table></div>`;
  }

  function bidBadge(s,leading){
    if(leading) return '<span class="badge badge-green">🏆 Leading</span>';
    return{ACTIVE:'<span class="badge badge-amber">Active</span>',OUTBID:'<span class="badge badge-red">Outbid</span>',SELECTED:'<span class="badge badge-green">✅ Winner</span>',REJECTED:'<span class="badge badge-gray">Rejected</span>'}[s]||`<span class="badge badge-gray">${s}</span>`;
  }
  function sb(s){return{OPEN:'badge-blue',BIDDING:'badge-amber',AWARDED:'badge-green',CANCELLED:'badge-red'}[s]||'badge-gray';}
  function ago(dt){ if(!dt)return'—'; const m=Math.floor((Date.now()-new Date(dt))/60000); return m<1?'just now':m<60?`${m}m ago`:`${Math.floor(m/60)}h ago`; }

 async function submitBid() {
    const price = parseFloat(document.getElementById('bid-price').value);
    const hours = parseInt(document.getElementById('bid-hours').value);
    const notes = document.getElementById('bid-notes').value.trim();
    const errEl = document.getElementById('bid-err');
    const okEl  = document.getElementById('bid-ok');
    errEl.classList.add('hidden');
    okEl.classList.add('hidden');

    if (!price || price <= 0) {
        errEl.textContent = 'Enter a valid price.';
        errEl.classList.remove('hidden'); return;
    }
    if (!hours || hours <= 0) {
        errEl.textContent = 'Enter estimated delivery hours.';
        errEl.classList.remove('hidden'); return;
    }

    // ✅ Client-side max hours check before even calling API
    if (reqData && reqData.maxDeliveryHours && hours > reqData.maxDeliveryHours) {
        errEl.textContent = '❌ Your delivery time (' + hours + ' hrs) exceeds the customer\'s maximum allowed time (' + reqData.maxDeliveryHours + ' hrs).';
        errEl.classList.remove('hidden'); return;
    }

    const btn = document.getElementById('bid-btn');
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    try {
        await Api.placeBid({
            requestId: parseInt(requestId),
            price,
            estimatedDeliveryHours: hours,
            notes
        });
        okEl.textContent = '✅ Bid placed! You are now leading.';
        okEl.classList.remove('hidden');
        document.getElementById('bid-price').value = '';
        document.getElementById('bid-hours').value = '';
        document.getElementById('bid-notes').value = '';
        showToast('Bid placed! You are leading.', 'success');
        loadBids();
    } catch (e) {
        // ✅ Show the exact server error message
        errEl.textContent = e.message;
        errEl.classList.remove('hidden');
        showToast(e.message, 'error');
    }

    btn.disabled = false;
    btn.textContent = 'Submit Bid →';
}

  function openAward(id,name,price){selectedBidId=id;document.getElementById('aw-shipper').textContent=name;document.getElementById('aw-price').textContent=fmt.price(price);document.getElementById('awardModal').classList.add('active');}
  function closeModal(){document.getElementById('awardModal').classList.remove('active');}

  async function confirmAward(){
    try{ await Api.selectWinningBid(selectedBidId); closeModal(); clearInterval(timer); showToast('🎉 Bid awarded! Order confirmed.','success'); loadRequest(); loadBids(); }
    catch(e){ showToast(e.message,'error'); }
  }

  function goBack() {
    if (isCustomer) location.href = '/customer-dashboard.html';
    else if (isShipper) location.href = '/shipper-dashboard.html';
    else location.href = '/admin-dashboard.html';
}
  function logout(){ Session.clear(); location.href='/index.html'; }

  (async()=>{ await loadRequest(); await loadBids(); timer=setInterval(loadBids,2000); })();
</script>
</body>
</html>

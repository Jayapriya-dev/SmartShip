<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SmartShip — Shipment Tracking</title>
    <link rel="stylesheet" type="text/css" href="/css/style.css"/>
    <style>
        .timeline { position: relative; padding: 0; list-style: none; }
        .timeline::before {
          content: '';
          position: absolute;
          left: 20px; top: 0; bottom: 0;
          width: 2px;
          background: rgba(37,99,235,0.15);
        }
        .timeline-item {
          position: relative;
          padding: 0 0 1.5rem 52px;
        }
        .timeline-item:last-child { padding-bottom: 0; }
        .timeline-dot {
          position: absolute;
          left: 10px; top: 2px;
          width: 22px; height: 22px;
          border-radius: 50%;
          background: #e2e8f0;
          border: 3px solid #fff;
          box-shadow: 0 0 0 2px #e2e8f0;
          display: flex; align-items: center; justify-content: center;
          font-size: 10px;
        }
        .timeline-dot.active {
          background: #2563eb;
          box-shadow: 0 0 0 3px rgba(37,99,235,0.2);
        }
        .timeline-dot.delivered {
          background: #059669;
          box-shadow: 0 0 0 3px rgba(5,150,105,0.2);
        }
        .timeline-dot.cancelled {
          background: #dc2626;
          box-shadow: 0 0 0 3px rgba(220,38,38,0.2);
        }
        .timeline-content {
          background: #fff;
          border: 1px solid rgba(0,0,0,0.08);
          border-radius: 8px;
          padding: 12px 16px;
          box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }
        .timeline-content .tl-status {
          font-weight: 700; font-size: 0.9rem; color: #0f172a;
        }
        .timeline-content .tl-location {
          font-size: 0.8rem; color: #2563eb;
          margin-top: 2px;
        }
        .timeline-content .tl-desc {
          font-size: 0.82rem; color: #64748b;
          margin-top: 4px;
        }
        .timeline-content .tl-time {
          font-size: 0.75rem; color: #94a3b8;
          margin-top: 6px;
        }
        .status-steps {
          display: flex; align-items: center;
          justify-content: space-between;
          margin-bottom: 2rem;
          position: relative;
        }
        .status-steps::before {
          content: '';
          position: absolute;
          top: 20px; left: 40px; right: 40px;
          height: 2px;
          background: #e2e8f0;
          z-index: 0;
        }
        .status-step {
          display: flex; flex-direction: column;
          align-items: center; gap: 8px;
          position: relative; z-index: 1;
          flex: 1;
        }
        .step-dot {
          width: 40px; height: 40px;
          border-radius: 50%;
          background: #e2e8f0;
          display: flex; align-items: center;
          justify-content: center;
          font-size: 1.1rem;
          border: 3px solid #fff;
          box-shadow: 0 0 0 2px #e2e8f0;
          transition: all 0.3s ease;
        }
        .step-dot.done {
          background: #059669;
          box-shadow: 0 0 0 3px rgba(5,150,105,0.2);
        }
        .step-dot.current {
          background: #2563eb;
          box-shadow: 0 0 0 3px rgba(37,99,235,0.25);
          animation: pulse 1.5s infinite;
        }
        .step-dot.cancelled {
          background: #dc2626;
          box-shadow: 0 0 0 3px rgba(220,38,38,0.2);
        }
        .step-label {
          font-size: 0.68rem; font-weight: 600;
          color: #94a3b8; text-align: center;
          text-transform: uppercase; letter-spacing: 0.04em;
          max-width: 70px;
        }
        .step-label.done, .step-label.current { color: #0f172a; }
    </style>
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" href="/index.html">
        <div class="logo-icon">🚚</div>
        Smart<span>Ship</span>
    </a>
    <div class="navbar-right">
        <div class="nav-user" id="nav-user"></div>
        <button class="btn btn-ghost btn-sm" onclick="goBack()">← Back</button>
        <button class="btn btn-ghost btn-sm" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="page-wrapper">
    <div id="loading" class="loader"><div class="spinner"></div> Loading tracking...</div>
    <div id="tracking-content" class="hidden">

        <!-- Order Info -->
        <div class="page-header">
            <div>
                <h1>📍 Shipment Tracking</h1>
                <div class="subtitle" id="order-subtitle"></div>
            </div>
            <span id="current-status-badge" class="badge" style="font-size:0.9rem;padding:8px 16px"></span>
        </div>

        <!-- Route Info -->
        <div class="request-info-grid" id="order-info"></div>

        <!-- Progress Steps -->
        <div class="card" style="margin-bottom:1.5rem">
            <div class="card-header"><h3>📦 Delivery Progress</h3></div>
            <div class="status-steps" id="status-steps"></div>
        </div>

        <!-- Shipper Update Form -->
        <div id="update-form-section" class="bid-form-card hidden">
            <h3 style="margin-bottom:1.1rem">🔄 Update Shipment Status</h3>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">New Status *</label>
                    <select id="track-status" class="form-control">
                        <option value="">-- Select Status --</option>
                        <option value="PICKED_UP">📦 Picked Up</option>
                        <option value="IN_TRANSIT">🚚 In Transit</option>
                        <option value="OUT_FOR_DELIVERY">🏠 Out for Delivery</option>
                        <option value="DELIVERED">🎉 Delivered</option>
                        <option value="CANCELLED">❌ Cancelled</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Current Location</label>
                    <input id="track-location" class="form-control" type="text"
                           placeholder="e.g. Bangalore Sorting Hub"/>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Description / Notes</label>
                <input id="track-desc" class="form-control" type="text"
                       placeholder="e.g. Package picked up from sender, en route to hub"/>
            </div>
            <div id="track-error"   class="alert alert-error   hidden"></div>
            <div id="track-success" class="alert alert-success hidden"></div>
            <button class="btn btn-primary" onclick="submitTracking()">
                Update Status →
            </button>
        </div>

        <!-- Timeline -->
        <div class="card">
            <div class="card-header">
                <h3>🕐 Tracking Timeline</h3>
                <span id="events-count" class="badge badge-blue">0 events</span>
            </div>
            <div id="timeline-container" style="padding:1rem 0">
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                    <h3>No tracking updates yet</h3>
                    <p>The shipper will update the status once the shipment is picked up.</p>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="/js/api.js"></script>
<script>
    if (!Session.isLoggedIn()) location.href = '/index.html';

    const params  = new URLSearchParams(location.search);
    const orderId = params.get('orderId');
    const user    = Session.get();
    const role    = Session.role();
    const isShipper  = role === 'SHIPPER';
    const isCustomer = role === 'CUSTOMER';

    if (!orderId) goBack();

    document.getElementById('nav-user').innerHTML =
      `${isCustomer ? '📦' : '🚛'} <strong>${user.fullName}</strong> · ${role}`;

    const STEPS = [
      { key: 'CONFIRMED',        icon: '✅', label: 'Confirmed' },
      { key: 'PICKED_UP',        icon: '📦', label: 'Picked Up' },
      { key: 'IN_TRANSIT',       icon: '🚚', label: 'In Transit' },
      { key: 'OUT_FOR_DELIVERY', icon: '🏠', label: 'Out for Delivery' },
      { key: 'DELIVERED',        icon: '🎉', label: 'Delivered' },
    ];

    const STATUS_COLORS = {
      CONFIRMED:        'badge-blue',
      PICKED_UP:        'badge-amber',
      IN_TRANSIT:       'badge-amber',
      OUT_FOR_DELIVERY: 'badge-amber',
      DELIVERED:        'badge-green',
      CANCELLED:        'badge-red',
    };

    let trackingData = null;
    let refreshTimer = null;

    async function loadTracking() {
      try {
        trackingData = await Api.getTracking(orderId);
        render(trackingData);
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('tracking-content').classList.remove('hidden');
      } catch(e) {
        showToast('Failed to load tracking: ' + e.message, 'error');
      }
    }

    function render(data) {
      const isCancelled = data.currentStatus === 'CANCELLED';
      const isDelivered = data.currentStatus === 'DELIVERED';

      // Subtitle
      document.getElementById('order-subtitle').textContent =
        `Order #${data.orderId}  ·  ${data.shipperName} → ${data.customerName}`;

      // Status badge
      const badge = document.getElementById('current-status-badge');
      badge.textContent = data.currentStatusLabel;
      badge.className = 'badge ' + (STATUS_COLORS[data.currentStatus] || 'badge-gray');
      badge.style.cssText = 'font-size:0.85rem;padding:7px 16px';

      // Order info chips
      document.getElementById('order-info').innerHTML = `
        <div class="info-chip">
          <div class="chip-label">From</div>
          <div class="chip-value">📍 ${data.pickupAddress}</div>
        </div>
        <div class="info-chip">
          <div class="chip-label">To</div>
          <div class="chip-value">🏁 ${data.dropAddress}</div>
        </div>
        <div class="info-chip">
          <div class="chip-label">Item</div>
          <div class="chip-value">📦 ${data.itemDescription}</div>
        </div>
        <div class="info-chip">
          <div class="chip-label">Shipper</div>
          <div class="chip-value">🚛 ${data.shipperName}</div>
        </div>`;

      // Progress steps
      const currentIdx = isCancelled ? -1 :
        STEPS.findIndex(s => s.key === data.currentStatus);

      document.getElementById('status-steps').innerHTML = isCancelled
        ? `<div style="text-align:center;width:100%;padding:1rem;color:#dc2626;font-weight:700">
             ❌ Shipment Cancelled
           </div>`
        : STEPS.map((step, i) => {
            const done    = i < currentIdx;
            const current = i === currentIdx;
            const cls     = done ? 'done' : current ? 'current' : '';
            return `
              <div class="status-step">
                <div class="step-dot ${cls}">${step.icon}</div>
                <div class="step-label ${cls}">${step.label}</div>
              </div>`;
          }).join('');

      // Show update form for shipper if not delivered/cancelled
      if (isShipper && !isDelivered && !isCancelled) {
        document.getElementById('update-form-section').classList.remove('hidden');

        // Disable already-passed statuses in dropdown
        const select = document.getElementById('track-status');
        Array.from(select.options).forEach(opt => {
          if (!opt.value) return;
          const optIdx = STEPS.findIndex(s => s.key === opt.value);
          opt.disabled = optIdx !== -1 && optIdx <= currentIdx;
        });
      } else {
        document.getElementById('update-form-section').classList.add('hidden');
      }

      // Timeline
      const events = data.timeline || [];
      document.getElementById('events-count').textContent =
        events.length + ' event' + (events.length !== 1 ? 's' : '');

      if (!events.length) {
        document.getElementById('timeline-container').innerHTML = `
          <div class="empty-state" style="padding:2rem">
            <div class="empty-icon">📭</div>
            <h3>No updates yet</h3>
            <p>Shipper will update once shipment is picked up.</p>
          </div>`;
        return;
      }

      // Render timeline newest first
      const reversed = [...events].reverse();
      document.getElementById('timeline-container').innerHTML =
        `<ul class="timeline" style="padding:0.5rem 0">
          ${reversed.map((e, i) => {
            const dotCls = e.status === 'DELIVERED' ? 'delivered'
                         : e.status === 'CANCELLED' ? 'cancelled'
                         : i === 0 ? 'active' : '';
            return `
              <li class="timeline-item">
                <div class="timeline-dot ${dotCls}"></div>
                <div class="timeline-content">
                  <div class="tl-status">${e.statusLabel}</div>
                  ${e.location
                    ? `<div class="tl-location">📍 ${e.location}</div>`
                    : ''}
                  ${e.description
                    ? `<div class="tl-desc">${e.description}</div>`
                    : ''}
                  <div class="tl-time">
                    ${formatDate(e.createdAt)}  ·  Updated by ${e.updatedByName}
                  </div>
                </div>
              </li>`;
          }).join('')}
        </ul>`;
    }

    async function submitTracking() {
      const status   = document.getElementById('track-status').value;
      const location = document.getElementById('track-location').value.trim();
      const desc     = document.getElementById('track-desc').value.trim();
      const errEl    = document.getElementById('track-error');
      const okEl     = document.getElementById('track-success');
      errEl.classList.add('hidden');
      okEl.classList.add('hidden');

      if (!status) {
        errEl.textContent = 'Please select a status.';
        errEl.classList.remove('hidden'); return;
      }

      try {
        await Api.updateTracking(orderId, { status, location, description: desc });
        okEl.textContent = '✅ Tracking updated successfully!';
        okEl.classList.remove('hidden');
        document.getElementById('track-status').value   = '';
        document.getElementById('track-location').value = '';
        document.getElementById('track-desc').value     = '';
        showToast('Tracking updated!', 'success');
        loadTracking();
      } catch(e) {
        errEl.textContent = e.message;
        errEl.classList.remove('hidden');
        showToast(e.message, 'error');
      }
    }

    function formatDate(dt) {
      if (!dt) return '—';
      return new Date(dt).toLocaleString('en-IN', {
        day: '2-digit', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function goBack() {
      if (isCustomer) location.href = '/customer-dashboard.html';
      else if (isShipper) location.href = '/shipper-dashboard.html';
      else location.href = '/admin-dashboard.html';
    }
    function logout() { Session.clear(); location.href = '/index.html'; }

    // Load and auto-refresh every 10 seconds
    loadTracking();
    refreshTimer = setInterval(loadTracking, 10000);
</script>
</body>
</html>

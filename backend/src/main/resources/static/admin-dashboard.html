<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SmartShip — Admin Dashboard</title>
    <link rel="stylesheet" type="text/css" href="/css/style.css"/>
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" href="/index.html">
        <div class="logo-icon">🚚</div>
        Smart<span>Ship</span>
    </a>
    <div class="navbar-right">
        <div class="nav-user">🔑 <strong id="nav-username"></strong> · Admin</div>
        <button class="btn btn-ghost btn-sm" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="page-wrapper">
    <div class="page-header">
        <div>
            <h1>Admin Dashboard</h1>
            <div class="subtitle">System overview · All users · All requests · All bids</div>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-label">Total Users</div>
            <div class="stat-value" id="stat-users">—</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Total Requests</div>
            <div class="stat-value" id="stat-requests">—</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Total Bids</div>
            <div class="stat-value" id="stat-bids">—</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Total Orders</div>
            <div class="stat-value" id="stat-orders">—</div>
        </div>
    </div>

    <!-- Tabs -->
    <div class="dash-tabs">
        <button class="dash-tab active" onclick="switchTab('users', this)">👥 All Users</button>
        <button class="dash-tab" onclick="switchTab('requests', this)">📦 All Requests</button>
        <button class="dash-tab" onclick="switchTab('orders', this)">📋 All Orders</button>
    </div>

    <div id="tab-users">
        <div id="users-container">
            <div class="loader"><div class="spinner"></div> Loading users...</div>
        </div>
    </div>

    <div id="tab-requests" class="hidden">
        <div id="requests-container">
            <div class="loader"><div class="spinner"></div> Loading requests...</div>
        </div>
    </div>

    <div id="tab-orders" class="hidden">
        <div id="orders-container">
            <div class="loader"><div class="spinner"></div> Loading orders...</div>
        </div>
    </div>
</div>

<script src="/js/api.js"></script>
<script>
    // Guard: only ADMIN
    if (!Session.isLoggedIn() || Session.role() !== 'ADMIN') location.href = '/index.html';
    document.getElementById('nav-username').textContent = Session.get().fullName;

    async function loadUsers() {
      try {
        const users = await Api.get('/admin/users');
        document.getElementById('stat-users').textContent = users.length;
        const el = document.getElementById('users-container');
        if (!users.length) { el.innerHTML = `<div class="empty-state"><div class="empty-icon">👥</div><h3>No users</h3></div>`; return; }
        el.innerHTML = `<div class="table-wrapper"><table>
          <thead><tr><th>ID</th><th>Username</th><th>Full Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Active</th><th>Joined</th></tr></thead>
          <tbody>${users.map(u => `<tr>
            <td>${u.id}</td>
            <td><strong>${u.username}</strong></td>
            <td>${u.fullName}</td>
            <td>${u.email}</td>
            <td>${u.phone || '—'}</td>
            <td><span class="badge ${roleBadge(u.role)}">${u.role}</span></td>
            <td><span class="badge ${u.active ? 'badge-green' : 'badge-red'}">${u.active ? 'Yes' : 'No'}</span></td>
            <td>${fmt.date(u.createdAt)}</td>
          </tr>`).join('')}</tbody>
        </table></div>`;
      } catch(e) { showToast('Failed to load users: ' + e.message, 'error'); }
    }

    async function loadRequests() {
      try {
        const reqs = await Api.get('/admin/requests');
        document.getElementById('stat-requests').textContent = reqs.length;
        const el = document.getElementById('requests-container');
        if (!reqs.length) { el.innerHTML = `<div class="empty-state"><div class="empty-icon">📦</div><h3>No requests</h3></div>`; return; }
        el.innerHTML = `<div class="table-wrapper"><table>
          <thead><tr><th>ID</th><th>Customer</th><th>Route</th><th>Item</th><th>Qty</th><th>Budget</th><th>Status</th><th>Bids</th><th>Date</th></tr></thead>
          <tbody>${reqs.map(r => `<tr>
            <td>${r.id}</td>
            <td>${r.customerName}</td>
            <td><strong>${r.pickupAddress}</strong> → ${r.dropAddress}</td>
            <td>${r.itemDescription}</td>
            <td>${r.quantity}</td>
            <td>${fmt.price(r.budgetLimit)}</td>
            <td><span class="badge ${sb(r.status)}">${r.status}</span></td>
            <td>${r.bidCount || 0}</td>
            <td>${fmt.date(r.createdAt)}</td>
          </tr>`).join('')}</tbody>
        </table></div>`;
      } catch(e) { showToast('Failed to load requests: ' + e.message, 'error'); }
    }

    async function loadOrders() {
      try {
        const orders = await Api.get('/admin/orders');
        document.getElementById('stat-orders').textContent = orders.length;
        const el = document.getElementById('orders-container');
        if (!orders.length) { el.innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div><h3>No orders</h3></div>`; return; }
        el.innerHTML = `<div class="table-wrapper"><table>
          <thead><tr><th>ID</th><th>Customer</th><th>Shipper</th><th>Route</th><th>Item</th><th>Final Price</th><th>Status</th><th>Date</th></tr></thead>
          <tbody>${orders.map(o => `<tr>
            <td>${o.id}</td>
            <td>${o.customerName}</td>
            <td>${o.shipperName}</td>
            <td><strong>${o.pickupAddress}</strong> → ${o.dropAddress}</td>
            <td>${o.itemDescription}</td>
            <td class="price-display">${fmt.price(o.finalPrice)}</td>
            <td><span class="badge badge-green">${o.status}</span></td>
            <td>${fmt.date(o.confirmedAt)}</td>
          </tr>`).join('')}</tbody>
        </table></div>`;
      } catch(e) { showToast('Failed to load orders: ' + e.message, 'error'); }
    }

    function roleBadge(r) {
      return { ADMIN:'badge-red', CUSTOMER:'badge-blue', SHIPPER:'badge-green' }[r] || 'badge-gray';
    }
    function sb(s) {
      return { OPEN:'badge-blue', BIDDING:'badge-amber', AWARDED:'badge-green', CANCELLED:'badge-red' }[s] || 'badge-gray';
    }

    function switchTab(tab, btn) {
      document.querySelectorAll('.dash-tab').forEach(t => t.classList.remove('active'));
      if (btn) btn.classList.add('active');
      ['users','requests','orders'].forEach(t =>
        document.getElementById(`tab-${t}`).classList.toggle('hidden', t !== tab));
      if (tab === 'requests') loadRequests();
      else if (tab === 'orders') loadOrders();
    }

    function logout() { Session.clear(); location.href = '/index.html'; }

    loadUsers();
</script>
</body>
</html>

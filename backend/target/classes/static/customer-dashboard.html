<div class="page-wrapper">
  <div class="page-header">
    <div><h1>Customer Dashboard</h1><div class="subtitle">Post requests · Monitor live bids · Award winners</div></div>
    <button class="btn btn-primary" onclick="openModal()">+ New Request</button>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-label">Total Requests</div><div class="stat-value" id="stat-total">—</div></div>
    <div class="stat-card"><div class="stat-label">Active Bidding</div><div class="stat-value" id="stat-bidding">—</div></div>
    <div class="stat-card"><div class="stat-label">Awarded Orders</div><div class="stat-value" id="stat-awarded">—</div></div>
  </div>

  <div class="dash-tabs">
    <button class="dash-tab active" onclick="switchTab('requests',this)">📦 My Requests</button>
    <button class="dash-tab" onclick="switchTab('orders',this)">📋 Order History</button>
  </div>

  <div id="tab-requests"><div id="requests-container"><div class="loader"><div class="spinner"></div> Loading...</div></div></div>
  <div id="tab-orders" class="hidden"><div id="orders-container"><div class="loader"><div class="spinner"></div> Loading...</div></div></div>
</div>

<!-- New Request Modal -->
<div class="modal-overlay" id="reqModal">
  <div class="modal">
    <div class="modal-header"><h3>📦 Post New Transport Request</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Pickup Address *</label><input id="f-pickup" class="form-control" placeholder="e.g. T.Nagar, Chennai"/></div>
      <div class="form-group"><label class="form-label">Drop Address *</label><input id="f-drop" class="form-control" placeholder="e.g. Koramangala, Bengaluru"/></div>
    </div>
    <div class="form-group"><label class="form-label">Item Description *</label><input id="f-item" class="form-control" placeholder="e.g. Electronic Components"/></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Quantity *</label><input id="f-qty" class="form-control" type="number" value="1" min="1"/></div>
      <div class="form-group"><label class="form-label">Weight (kg)</label><input id="f-wt" class="form-control" type="number" step="0.1" placeholder="12.5"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Budget Limit (₹)</label><input id="f-budget" class="form-control" type="number" placeholder="5000"/></div>
      <div class="form-group"><label class="form-label">Required By</label><input id="f-date" class="form-control" type="datetime-local"/></div>

<!--                <option value="BALANCED">⚖️ Balanced — Best mix of price and speed</option>-->
<!--            </select>-->
<!--        </div>-->

<!--            💰 <strong>Price mode:</strong> Shippers must lower the price to lead. Tie-break by faster time.-->
<!--        </div>-->

<!--            </div>-->
<!--        </div>-->
</div>

    <div id="req-err" class="alert alert-error hidden"></div>
    <div style="display:flex;gap:1rem;justify-content:flex-end;margin-top:1rem">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitRequest()">Post Request →</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
    function togglePrefHint() {
  const pref = document.getElementById('f-pref').value;
  const hints = {
    PRICE:    '💰 <strong>Price mode:</strong> Shippers must lower price to lead. Tie-break by faster delivery.',
    TIME:     '⚡ <strong>Time mode:</strong> Shippers must deliver faster to lead. Tie-break by lower price.',
    BALANCED: '⚖️ <strong>Balanced mode:</strong> Best combined score of price (60%) + speed (40%) leads.',
  };
  document.getElementById('pref-hint').innerHTML = hints[pref];
}
  if (!Session.isLoggedIn() || Session.role() !== 'CUSTOMER') location.href = '/index.html';
  document.getElementById('nav-username').textContent = Session.get().fullName;
  let allRequests = [];

  async function loadRequests() {
    try {
      allRequests = await Api.getMyReqs();
      document.getElementById('stat-total').textContent   = allRequests.length;
      document.getElementById('stat-bidding').textContent = allRequests.filter(r=>r.status==='BIDDING').length;
      document.getElementById('stat-awarded').textContent = allRequests.filter(r=>r.status==='AWARDED').length;
      renderRequests();
    } catch(e) { showToast(e.message,'error'); }
  }

  function renderRequests() {
    const el = document.getElementById('requests-container');
    if (!allRequests.length) {
      el.innerHTML=`<div class="empty-state"><div class="empty-icon">📦</div><h3>No requests yet</h3><p>Click "+ New Request" to post your first delivery request.</p></div>`; return;
    }
    el.innerHTML=`<div class="requests-grid">${allRequests.map(r=>`
      <div class="request-card" onclick="location.href='/bidding.html?requestId=${r.id}&role=customer'">
        <div>
          <div class="request-route"><span>${r.pickupAddress}</span><span class="route-arrow"> → </span><span>${r.dropAddress}</span></div>
          <div class="request-meta">
            <span>📦 ${r.itemDescription}</span><span>🔢 Qty: ${r.quantity}</span>
            ${r.weightKg?`<span>⚖️ ${r.weightKg}kg</span>`:''}
            ${r.budgetLimit?`<span>💰 Budget: ${fmt.price(r.budgetLimit)}</span>`:''}
            <span>📅 ${fmt.date(r.createdAt)}</span>
          </div>
        </div>
        <div class="request-actions">
          <div><div class="bid-count-badge">${r.bidCount||0}</div><div class="bid-count-label">bids</div></div>
          ${r.lowestBid?`<div style="font-size:0.75rem;color:#10b981">Lowest: ${fmt.price(r.lowestBid)}</div>`:''}
          <span class="badge ${sb(r.status)}">${r.status}</span>
        </div>
      </div>`).join('')}</div>`;
  }

  async function loadOrders() {
    try {
      const orders = await Api.getMyOrdersCustomer();
      const el = document.getElementById('orders-container');
      if (!orders.length) { el.innerHTML=`<div class="empty-state"><div class="empty-icon">📋</div><h3>No orders yet</h3></div>`; return; }
      el.innerHTML=`<div class="table-wrapper"><table>
        <thead><tr><th>Route</th><th>Item</th><th>Shipper</th><th>Final Price</th><th>Delivery</th><th>Status</th><th>Date</th></tr></thead>
        <tbody>${orders.map(o=>`<tr>
          <td><strong>${o.pickupAddress}</strong> → ${o.dropAddress}</td>
          <td>${o.itemDescription}</td><td>🚛 ${o.shipperName}</td>
          <td class="price-display">${fmt.price(o.finalPrice)}</td>
          <td>${fmt.hours(o.estimatedDeliveryHours)}</td>
          <td><span class="badge ${sb(o.status)}">${o.status}</span></td>
          <td>${fmt.date(o.confirmedAt)}</td>
        </tr>`).join('')}</tbody></table></div>`;
    } catch(e) { showToast(e.message,'error'); }
  }

  function sb(s){return{OPEN:'badge-blue',BIDDING:'badge-amber',AWARDED:'badge-green',CONFIRMED:'badge-green',DELIVERED:'badge-green',CANCELLED:'badge-red',IN_TRANSIT:'badge-blue'}[s]||'badge-gray';}

  function switchTab(tab,btn) {
    document.querySelectorAll('.dash-tab').forEach(t=>t.classList.remove('active'));
    if(btn) btn.classList.add('active');
    document.getElementById('tab-requests').classList.toggle('hidden', tab!=='requests');
    document.getElementById('tab-orders').classList.toggle('hidden', tab!=='orders');
    if(tab==='orders') loadOrders();
  }

  function openModal()  { document.getElementById('reqModal').classList.add('active'); }
  function closeModal() { document.getElementById('reqModal').classList.remove('active'); }

  async function submitRequest() {
    const errEl = document.getElementById('req-err'); errEl.classList.add('hidden');
    const body = {
      pickupAddress:   document.getElementById('f-pickup').value.trim(),
      dropAddress:     document.getElementById('f-drop').value.trim(),
      itemDescription: document.getElementById('f-item').value.trim(),
      quantity:        parseInt(document.getElementById('f-qty').value),
      weightKg:        parseFloat(document.getElementById('f-wt').value)||null,
      budgetLimit:     parseFloat(document.getElementById('f-budget').value)||null,
      requiredBy:      document.getElementById('f-date').value||null,
<!--      bidPreference:   document.getElementById('f-pref').value,-->
<!--      maxDeliveryHours: parseInt(document.getElementById('f-maxhours').value) || null,-->
    };
    if(!body.pickupAddress||!body.dropAddress||!body.itemDescription||!body.quantity){
      errEl.textContent='Please fill all required fields.'; errEl.classList.remove('hidden'); return;
    }
    try { await Api.createRequest(body); closeModal(); showToast('Request posted!','success'); loadRequests(); }
    catch(e) { errEl.textContent=e.message; errEl.classList.remove('hidden'); }

  }

  function logout() { Session.clear(); location.href='/index.html'; }
  loadRequests();
</script>
</body>
</html>

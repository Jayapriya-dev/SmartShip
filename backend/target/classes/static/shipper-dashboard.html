<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartShip — Shipper Dashboard</title>
  <link rel="stylesheet" type="text/css" href="/css/style.css"/>
</head>
<body>
<nav class="navbar">
  <a class="navbar-brand" href="/index.html"><div class="logo-icon">🚚</div>Smart<span>Ship</span></a>
  <div class="navbar-right">
    <div class="live-indicator"><div class="pulse-dot"></div> Live</div>
    <div class="nav-user">🚛 <strong id="nav-username"></strong> · Shipper</div>
    <button class="btn btn-ghost btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="page-wrapper">
  <div class="page-header">
    <div><h1>Shipper Dashboard</h1><div class="subtitle">Browse open requests · Bid competitively · Win shipments</div></div>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-label">Available Requests</div><div class="stat-value" id="stat-avail">—</div></div>
    <div class="stat-card"><div class="stat-label">My Active Bids</div><div class="stat-value" id="stat-active">—</div></div>
    <div class="stat-card"><div class="stat-label">Won Orders</div><div class="stat-value" id="stat-won">—</div></div>
  </div>

  <div class="dash-tabs">
    <button class="dash-tab active" onclick="switchTab('available',this)">📋 Available Requests</button>
    <button class="dash-tab" onclick="switchTab('mybids',this)">🎯 My Bids</button>
    <button class="dash-tab" onclick="switchTab('orders',this)">✅ Won Orders</button>
  </div>

  <div id="tab-available"><div id="avail-container"><div class="loader"><div class="spinner"></div> Loading...</div></div></div>
  <div id="tab-mybids" class="hidden"><div id="bids-container"><div class="loader"><div class="spinner"></div> Loading...</div></div></div>
  <div id="tab-orders" class="hidden"><div id="orders-container"><div class="loader"><div class="spinner"></div> Loading...</div></div></div>
</div>

<script src="/js/api.js"></script>
<script>
  if (!Session.isLoggedIn() || Session.role() !== 'SHIPPER') location.href = '/index.html';
  document.getElementById('nav-username').textContent = Session.get().fullName;
  let activeTab = 'available', timer = null;

  async function loadAvailable() {
    try {
      const reqs = await Api.getActiveReqs();
      document.getElementById('stat-avail').textContent = reqs.length;
      const el = document.getElementById('avail-container');
      if (!reqs.length) { el.innerHTML=`<div class="empty-state"><div class="empty-icon">📦</div><h3>No open requests</h3><p>Check back soon!</p></div>`; return; }
      el.innerHTML=`<div class="requests-grid">${reqs.map(r=>`
        <div class="request-card" onclick="location.href='/bidding.html?requestId=${r.id}&role=shipper'">
          <div>
            <div class="request-route"><span>${r.pickupAddress}</span><span class="route-arrow"> → </span><span>${r.dropAddress}</span></div>
            <div class="request-meta">
              <span>📦 ${r.itemDescription}</span><span>🔢 Qty: ${r.quantity}</span>
              ${r.weightKg?`<span>⚖️ ${r.weightKg}kg</span>`:''}
              ${r.budgetLimit?`<span>💰 Budget: ${fmt.price(r.budgetLimit)}</span>`:''}
              <span>👤 ${r.customerName}</span>
            </div>
          </div>
          <div class="request-actions">
            <div><div class="bid-count-badge">${r.bidCount||0}</div><div class="bid-count-label">bids</div></div>
            ${r.lowestBid?`<div style="font-size:0.75rem;color:#10b981">Lowest: ${fmt.price(r.lowestBid)}</div>`:''}
            <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();location.href='/bidding.html?requestId=${r.id}&role=shipper'">Bid Now →</button>
          </div>
        </div>`).join('')}</div>`;
    } catch(e) {}
  }

  async function loadMyBids() {
    try {
      const bids = await Api.getMyBids();
      document.getElementById('stat-active').textContent = bids.filter(b=>b.status==='ACTIVE').length;
      const el = document.getElementById('bids-container');
      if (!bids.length) { el.innerHTML=`<div class="empty-state"><div class="empty-icon">🎯</div><h3>No bids yet</h3></div>`; return; }
      el.innerHTML=`<div class="table-wrapper"><table>
        <thead><tr><th>Request</th><th>Your Price</th><th>Delivery</th><th>Status</th><th>Action</th></tr></thead>
        <tbody>${bids.map(b=>`<tr class="${b.status==='ACTIVE'?'lowest-bid-row':''}">
          <td><a href="/bidding.html?requestId=${b.requestId}&role=shipper" style="color:#f59e0b;text-decoration:none">REQ-${b.requestId}</a></td>
          <td class="price-display">${fmt.price(b.price)}</td>
          <td>${fmt.hours(b.estimatedDeliveryHours)}</td>
          <td>${bidBadge(b.status)}</td>
          <td>${b.status==='OUTBID'?`<button class="btn btn-primary btn-sm" onclick="location.href='/bidding.html?requestId=${b.requestId}&role=shipper'">Rebid</button>`:'—'}</td>
        </tr>`).join('')}</tbody></table></div>`;
    } catch(e) {}
  }

  async function loadOrders() {
    try {
      const orders = await Api.getMyOrdersAsShipper();
      document.getElementById('stat-won').textContent = orders.length;
      const el = document.getElementById('orders-container');
      if (!orders.length) {
        el.innerHTML=`<div class="empty-state"><div class="empty-icon">🏆</div><h3>No won orders yet</h3><p>Keep bidding to win!</p></div>`;
        return;
      }
      el.innerHTML=`<div class="table-wrapper"><table>
        <thead><tr>
          <th>Route</th>
          <th>Item</th>
          <th>Customer</th>
          <th>Final Price</th>
          <th>Delivery</th>
          <th>Status</th>
          <th>Action</th>
        </tr></thead>
        <tbody>${orders.map(o=>`<tr>
          <td><strong>${o.pickupAddress}</strong><br><span style="color:#64748b">→ ${o.dropAddress}</span></td>
          <td>${o.itemDescription}</td>
          <td>👤 ${o.customerName}</td>
          <td class="price-display">${fmt.price(o.finalPrice)}</td>
          <td>${fmt.hours(o.estimatedDeliveryHours)}</td>
          <td><span class="badge ${statusBadge(o.status)}">${o.status}</span></td>
          <td>
            <button class="btn btn-primary btn-sm"
              onclick="location.href='/tracking.html?orderId=${o.id}'">
              🔄 Update
            </button>
          </td>
        </tr>`).join('')}</tbody>
      </table></div>`;
    } catch(e) { showToast(e.message,'error'); }
}

function statusBadge(s) {
    return {
        CONFIRMED:        'badge-blue',
        PICKED_UP:        'badge-amber',
        IN_TRANSIT:       'badge-amber',
        OUT_FOR_DELIVERY: 'badge-amber',
        DELIVERED:        'badge-green',
        CANCELLED:        'badge-red'
    }[s] || 'badge-gray';
}

  function bidBadge(s){return{ACTIVE:'<span class="badge badge-green">🏆 Leading</span>',OUTBID:'<span class="badge badge-red">⚠️ Outbid</span>',SELECTED:'<span class="badge badge-green">✅ Won</span>',REJECTED:'<span class="badge badge-gray">Rejected</span>'}[s]||`<span class="badge badge-gray">${s}</span>`;}

  function switchTab(tab, btn) {
    activeTab = tab;
    document.querySelectorAll('.dash-tab').forEach(t=>t.classList.remove('active'));
    if(btn) btn.classList.add('active');
    ['available','mybids','orders'].forEach(t=>document.getElementById(`tab-${t}`).classList.toggle('hidden',t!==tab));
    if(tab==='mybids') loadMyBids();
    else if(tab==='orders') loadOrders();
  }
  function renderMyBids(bids) {
    const el = document.getElementById('bids-container');
    if (!bids.length) {
        el.innerHTML = `<div class="empty-state"><div class="empty-icon">🎯</div>
        <h3>No bids yet</h3><p>Go to Available Requests and place your first bid.</p></div>`;
        return;
    }
    el.innerHTML = `<div class="table-wrapper"><table>
        <thead><tr>
            <th>Request</th>
            <th>Route</th>
            <th>Customer Preference</th>
            <th>Max Time Allowed</th>
            <th>Budget Limit</th>
            <th>Your Price</th>
            <th>Your Delivery</th>
            <th>Status</th>
            <th>Action</th>
        </tr></thead>
        <tbody>${bids.map(b => `<tr class="${b.status === 'ACTIVE' ? 'lowest-bid-row' : ''}">
            <td>
                <a href="/bidding.html?requestId=${b.requestId}"
                   style="color:#2563eb;text-decoration:none;font-weight:600">
                   REQ-${b.requestId}
                </a>
            </td>
            <td style="font-size:0.82rem;color:#334155">
                ${b.pickupAddress || '—'} → ${b.dropAddress || '—'}
            </td>
            <td>${prefBadge(b.bidPreference)}</td>
            <td>
                ${b.maxDeliveryHours
                    ? `<span style="color:#dc2626;font-weight:700">⏱ ${fmt.hours(b.maxDeliveryHours)}</span>`
                    : '<span style="color:#94a3b8">No limit</span>'}
            </td>
            <td>
                ${b.budgetLimit
                    ? `<span style="color:#059669;font-weight:700">${fmt.price(b.budgetLimit)}</span>`
                    : '<span style="color:#94a3b8">No limit</span>'}
            </td>
            <td class="price-display">${fmt.price(b.price)}</td>
            <td style="font-weight:600">${fmt.hours(b.estimatedDeliveryHours)}</td>
            <td>${bidBadge(b.status)}</td>
            <td>${b.status === 'OUTBID'
                ? `<button class="btn btn-primary btn-sm"
                    onclick="location.href='/bidding.html?requestId=${b.requestId}'">
                    ⚡ Rebid
                  </button>`
                : '—'}</td>
        </tr>`).join('')}</tbody>
    </table></div>`;
}
function renderAvailable(requests) {
    const el = document.getElementById('avail-container');
    if (!requests.length) {
        el.innerHTML = `<div class="empty-state"><div class="empty-icon">📦</div>
        <h3>No open requests right now</h3>
        <p>Check back soon — new requests appear here in real time.</p></div>`;
        return;
    }
    el.innerHTML = `<div class="requests-grid">${requests.map(r => `
        <div class="request-card" onclick="location.href='/bidding.html?requestId=${r.id}'">
            <div>
                <div class="request-route">
                    <span>${r.pickupAddress}</span>
                    <span class="route-arrow"> → </span>
                    <span>${r.dropAddress}</span>
                </div>
                <div class="request-meta" style="margin-bottom:8px">
                    <span>📦 ${r.itemDescription}</span>
                    <span>🔢 Qty: ${r.quantity}</span>
                    ${r.weightKg ? `<span>⚖️ ${r.weightKg} kg</span>` : ''}
                    <span>👤 ${r.customerName}</span>
                </div>
                <!-- Constraints Row -->
                <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:6px">
                    ${prefBadge(r.bidPreference)}
                    ${r.budgetLimit
                        ? `<span style="background:rgba(5,150,105,0.1);color:#059669;
                            padding:3px 10px;border-radius:20px;font-size:0.72rem;font-weight:700">
                            💰 Budget: ${fmt.price(r.budgetLimit)}
                           </span>`
                        : ''}
                    ${r.maxDeliveryHours
                        ? `<span style="background:rgba(220,38,38,0.08);color:#dc2626;
                            padding:3px 10px;border-radius:20px;font-size:0.72rem;font-weight:700">
                            ⏱ Max Time: ${fmt.hours(r.maxDeliveryHours)}
                           </span>`
                        : ''}
                    ${r.lowestBid
                        ? `<span style="background:rgba(37,99,235,0.1);color:#2563eb;
                            padding:3px 10px;border-radius:20px;font-size:0.72rem;font-weight:700">
                            🏆 Current Best: ${fmt.price(r.lowestBid)}
                           </span>`
                        : ''}
                </div>
            </div>
            <div class="request-actions">
                <div>
                    <div class="bid-count-badge">${r.bidCount || 0}</div>
                    <div class="bid-count-label">bids</div>
                </div>
                <button class="btn btn-primary btn-sm"
                    onclick="event.stopPropagation();location.href='/bidding.html?requestId=${r.id}'">
                    Bid Now →
                </button>
            </div>
        </div>`).join('')}</div>`;
}
  function logout() { Session.clear(); location.href='/index.html'; }

  loadAvailable();
  loadMyBids();
  timer = setInterval(()=>{ if(activeTab==='available') loadAvailable(); else if(activeTab==='mybids') loadMyBids(); }, 3000);
</script>
</body>
</html>
